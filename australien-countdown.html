<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abflug nach Australien</title>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;600;700&family=Righteous&display=swap" rel="stylesheet">
<style>
  :root {
    --sky:    #00b4d8;
    --ocean:  #0077b6;
    --sand:   #f4a261;
    --coral:  #e76f51;
    --sun:    #ffd166;
    --leaf:   #2ec4b6;
    --white:  #ffffff;
    --muted:  rgba(255,255,255,0.55);
    --card-bg: rgba(255,255,255,0.12);
    --card-border: rgba(255,255,255,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(160deg, #0077b6 0%, #00b4d8 40%, #48cae4 65%, #90e0ef 100%);
    color: var(--white);
    font-family: 'Cabin', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    position: relative;
    overflow: hidden;
  }

  .sun {
    position: fixed;
    top: -60px; right: -60px;
    width: 220px; height: 220px;
    background: radial-gradient(circle, #ffd166 30%, #f4a261 70%, transparent 100%);
    border-radius: 50%;
    opacity: 0.85;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.85; }
    50%      { transform: scale(1.06); opacity: 0.95; }
  }

  .waves {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 100px;
    overflow: hidden;
  }
  .wave {
    position: absolute;
    bottom: 0;
    width: 200%;
    height: 80px;
    background: rgba(255,255,255,0.15);
    border-radius: 50% 50% 0 0 / 30px 30px 0 0;
    animation: wave var(--spd) linear infinite;
  }
  .wave:nth-child(1) { --spd: 7s; animation-delay: 0s;   opacity: 0.5; }
  .wave:nth-child(2) { --spd: 5s; animation-delay: -2s;  opacity: 0.3; height: 55px; }
  .wave:nth-child(3) { --spd: 9s; animation-delay: -4s;  opacity: 0.2; height: 40px; }
  @keyframes wave {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .bubbles { position: fixed; inset: 0; pointer-events: none; }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    animation: rise var(--d) var(--delay) ease-in infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(1); opacity: 0.7; }
    100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
    position: relative;
    z-index: 2;
  }

  .label-small {
    font-size: 0.65rem;
    letter-spacing: 0.35em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }

  h1 {
    font-family: 'Righteous', sans-serif;
    font-size: clamp(2rem, 6vw, 3.4rem);
    color: var(--white);
    letter-spacing: 0.03em;
    text-shadow: 0 2px 20px rgba(0,0,0,0.2);
    line-height: 1.1;
  }

  .destination {
    margin-top: 0.6rem;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    color: var(--sun);
    text-transform: uppercase;
    font-weight: 700;
  }

  .divider {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--sun), transparent);
    margin: 1.2rem auto;
    border-radius: 2px;
  }

  .grid {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    width: 100%;
    max-width: 680px;
    position: relative;
    z-index: 2;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 1.6rem 2rem;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.15);
  }

  .card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 16px 16px 0 0;
  }
  .card:nth-child(1)::after { background: linear-gradient(90deg, var(--coral), var(--sun)); }
  .card:nth-child(2)::after { background: linear-gradient(90deg, var(--leaf), var(--sky)); }
  .card:nth-child(3)::after { background: linear-gradient(90deg, var(--sun), var(--sand)); }

  .card-label {
    font-size: 0.58rem;
    letter-spacing: 0.28em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 1.1rem;
    font-weight: 700;
  }

  .values {
    display: flex;
    align-items: baseline;
    gap: 0.25rem;
    flex-wrap: wrap;
  }

  .unit-group {
    display: flex;
    align-items: baseline;
    gap: 0.15rem;
    margin-right: 0.7rem;
  }

  .num {
    font-family: 'Righteous', sans-serif;
    font-size: clamp(2.4rem, 6.5vw, 3.6rem);
    color: var(--white);
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    min-width: 2ch;
    display: inline-block;
    text-shadow: 0 2px 12px rgba(0,0,0,0.15);
    transition: color 0.2s;
  }

  .num.flash { color: var(--sun); }

  .num.sec {
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    color: rgba(255,255,255,0.6);
  }

  .unit {
    font-size: 0.58rem;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
    padding-bottom: 0.3rem;
    font-weight: 700;
  }

  .progress-bar {
    margin-top: 1rem;
    height: 3px;
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--coral), var(--sun));
    width: 0%;
    border-radius: 3px;
    transition: width 1s linear;
  }

  .date-info {
    margin-top: 2.5rem;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .date-info p {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    font-weight: 600;
  }

  .date-info strong { color: var(--sun); }

  .plane {
    display: inline-block;
    margin: 0 0.5rem;
    font-size: 1.1em;
    animation: fly 3s ease-in-out infinite;
  }
  @keyframes fly {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-5px) rotate(5deg); }
  }

  .deco {
    position: fixed;
    font-size: 2rem;
    opacity: 0.15;
    pointer-events: none;
    animation: drift var(--d) ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translateY(0) rotate(var(--r1)); }
    to   { transform: translateY(-15px) rotate(var(--r2)); }
  }
</style>
</head>
<body>

<div class="sun"></div>
<div class="waves">
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
</div>
<div class="bubbles" id="bubbles"></div>

<header>
  <p class="label-small">Countdown</p>
  <h1>Abflug nach Australien 🦘</h1>
  <p class="destination">Berlin <span style="color:rgba(255,255,255,0.8)">→</span> Brisbane</p>
  <div class="divider"></div>
</header>

<div class="grid">

  <div class="card">
    <p class="card-label">Tage · Stunden · Minuten · Sekunden</p>
    <div class="values">
      <div class="unit-group">
        <span class="num" id="d">—</span>
        <span class="unit">Tage</span>
      </div>
      <div class="unit-group">
        <span class="num" id="h">—</span>
        <span class="unit">Std</span>
      </div>
      <div class="unit-group">
        <span class="num" id="m">—</span>
        <span class="unit">Min</span>
      </div>
      <div class="unit-group">
        <span class="num sec" id="s">—</span>
        <span class="unit">Sek</span>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
  </div>

  <div class="card">
    <p class="card-label">Stunden · Minuten · Sekunden</p>
    <div class="values">
      <div class="unit-group">
        <span class="num" id="th">—</span>
        <span class="unit">Stunden</span>
      </div>
      <div class="unit-group">
        <span class="num" id="tm">—</span>
        <span class="unit">Min</span>
      </div>
      <div class="unit-group">
        <span class="num sec" id="ts">—</span>
        <span class="unit">Sek</span>
      </div>
    </div>
  </div>

</div>

<div class="date-info">
  <p>27. Mai 2026 <span class="plane">✈️</span> <strong>18:25 Uhr</strong> · Berlin</p>
</div>

<script>
  // Bubbles
  const bubblesEl = document.getElementById('bubbles');
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const sz = 6 + Math.random() * 20;
    b.style.width  = sz + 'px';
    b.style.height = sz + 'px';
    b.style.left   = Math.random() * 100 + '%';
    b.style.bottom = '-40px';
    b.style.setProperty('--d', (8 + Math.random() * 10) + 's');
    b.style.setProperty('--delay', (Math.random() * 10) + 's');
    bubblesEl.appendChild(b);
  }

  // Deco emojis
  const decos = ['🌊','🐠','🌴','☀️','🐚','🦜','🐊'];
  const pos    = [[5,10],[90,15],[8,72],[85,68],[50,5],[14,48],[80,42]];
  decos.forEach((em, i) => {
    const el = document.createElement('div');
    el.className = 'deco';
    el.textContent = em;
    el.style.left = pos[i][0] + '%';
    el.style.top  = pos[i][1] + '%';
    el.style.setProperty('--d', (4 + Math.random() * 4) + 's');
    el.style.setProperty('--r1', (Math.random() * 10 - 5) + 'deg');
    el.style.setProperty('--r2', (Math.random() * 10 - 5) + 'deg');
    document.body.appendChild(el);
  });

  // Countdown — 27 May 2026, 18:25 CEST = 16:25 UTC
  const target = new Date('2026-05-27T16:25:00Z');
  const start  = new Date('2026-01-01T00:00:00Z');

  function pad(n) { return String(Math.max(0, n)).padStart(2, '0'); }

  function flash(id) {
    const el = document.getElementById(id);
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 400);
  }

  let prevHour = null;

  function update() {
    const now  = new Date();
    const diff = target - now;

    if (diff <= 0) {
      ['d','h','m','s','th','tm','ts'].forEach(id => document.getElementById(id).textContent = '00');
      document.querySelector('.progress-fill').style.width = '100%';
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const totalMinutes = Math.floor(totalSeconds / 60);
    const totalHours   = Math.floor(totalMinutes / 60);
    const days         = Math.floor(totalHours / 24);
    const hours        = totalHours % 24;
    const secs         = totalSeconds % 60;
    const mins         = totalMinutes % 60;

    document.getElementById('d').textContent  = days;
    document.getElementById('h').textContent  = pad(hours);
    document.getElementById('m').textContent  = pad(mins);
    document.getElementById('s').textContent  = pad(secs);
    document.getElementById('th').textContent = totalHours;
    document.getElementById('tm').textContent = pad(mins);
    document.getElementById('ts').textContent = pad(secs);

    if (prevHour !== null && prevHour !== totalHours) {
      flash('h'); flash('th');
    }
    prevHour = totalHours;

    const pct = Math.min(100, Math.max(0, ((now - start) / (target - start)) * 100));
    document.getElementById('prog').style.width = pct + '%';
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
